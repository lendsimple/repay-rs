[package]
name = "repay"
description = "A typed client for the Repay Gateway API (Repay Online), for native and WebAssembly targets."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
documentation = "https://docs.rs/repay"
keywords = ["repay", "payments", "ach", "credit-card", "wasm"]
categories = ["api-bindings", "finance", "wasm"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
bon = "3.10.2"
# Exact: the derive's output calls this crate's hidden internals.
repay-derive = { version = "=0.1.0", path = "../repay-derive" }
reqwest = { version = "0.13.5", default-features = false, optional = true }
rust_decimal = { version = "1.43.0", features = ["macros"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["parsing", "formatting", "macros"] }
tracing = "0.1.44"
ureq = { version = "3.4.2", default-features = false, optional = true }

[dev-dependencies]
insta = "1.49.0"
mockito = "1.7.2"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = "0.3.23"
trybuild = "1.0.122"

[features]
default = ["reqwest", "rustls"]
## `ReqwestTransport`, the async `Client`'s default transport (runs on tokio, or
## on `fetch` in WebAssembly).
reqwest = ["dep:reqwest"]
## `blocking::UreqTransport`, the blocking `Client`'s default transport.
ureq = ["dep:ureq"]
## TLS with rustls.
rustls = ["reqwest?/rustls", "ureq?/rustls"]
## TLS with the platform's native library.
native-tls = ["reqwest?/native-tls", "ureq?/native-tls"]

[[example]]
name = "card_sale"
required-features = ["reqwest"]

[[example]]
name = "card_sale_blocking"
required-features = ["ureq"]
