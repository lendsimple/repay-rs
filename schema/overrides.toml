# Adjustments applied by `cargo xtask codegen` on top of repay-v1.json and
# repay-v1-internal.json.
#
# `Def.field` keys use the spec's definition and property names; `OpId.param` keys
# use the operation ID and the parameter's wire name. Every entry must match
# something in the spec; a stale entry is a codegen error.

# .NET types Swashbuckle emitted that no operation uses.
skip_definitions = [
    "CancellationToken",
    "SafeWaitHandle",
    "WaitHandle",
    # Superseded request models still in the assembly.
    "DigitalWalletUriRequest",
    "GetCardTransactionsRequest",
]

# Values redacted in `Debug` output, by property name.
sensitive = [
    "account_number",
    "ach_token",
    "authentication_cryptogram",
    "authentication_payment_token",
    "card_number",
    "card_token",
    "cvv",
    "date_of_birth",
    "device_card_data",
    "exp_date",
    "external_payment_token",
    "magnetic_stripe_data",
    "primary_account_number",
    "token_pan",
]

# Minimum/maximum that do not apply to the Rust type.
ignore_bounds = [
    # A string enum that also carries the bounds of the .NET enum's numbers.
    "ContractRequest.status",
]

# The spec's patterns use lookaround, which a regex crate without backtracking
# cannot run, so each one is checked by a hand-written rule in
# `repay::validate::rules`.
[patterns]
"^(?!.*<).*$" = "no_angle_bracket"
"^[^#%^&+*()\\=\\[\\]{}:'<>./?|\\s]+$" = "wallet_merchant_id"
"^(?=.{1,253}\\.?$)(?:(?!-|[^.]+_)[A-Za-z0-9-_]{1,63}(?<!-)(?:\\.|$)){2,}$" = "hostname"

# Rust names for definitions.
[rename]
# Instances of a .NET generic; `[` is not valid in a Rust name.
"TransactionsReportResponse[ReconciliationCardTransactionData]" = "ReconciliationCardTransactionsReport"
"TransactionsReportResponse[RegionalTransactionDetailData]" = "RegionalTransactionDetailReport"

# Property types. A name-based entry applies only where the spec's type fits the
# target (an ID only to integers, `Amount` only to numbers, and so on).
[retype.by_name]
# Money, kept exact instead of `f64`.
adjustment_amount = "Amount"
amount = "Amount"
amt_bills_to_date = "Amount"
auth_amount = "Amount"
base_amount = "Amount"
capture_amount = "Amount"
convenience_amount = "Amount"
convenience_amt = "Amount"
disbursed_amount = "Amount"
disbursement_service_fee = "Amount"
discount_amount = "Amount"
duty_amount = "Amount"
freight_amount = "Amount"
funding_amount = "Amount"
item_tax_amount = "Amount"
item_total_amount = "Amount"
item_unit_price = "Amount"
merchant_disbursement_service_fee = "Amount"
negative_amount = "Amount"
original_amount = "Amount"
paid_amount = "Amount"
positive_amount = "Amount"
repay_disbursement_service_fee = "Amount"
requested_auth_amount = "Amount"
return_amount = "Amount"
reversal_amount = "Amount"
sale_amount = "Amount"
settle_amount = "Amount"
subtotal = "Amount"
# A number in responses; `[retype.fields]` covers the requests that send a string.
surcharge = "Amount"
surcharge_amount = "Amount"
tax = "Amount"
tax_amount = "Amount"
tip_amount = "Amount"
total_amount = "Amount"
# IDs, so that one kind cannot be passed for another.
auth_form_id = "AuthFormId"
contract_key = "ContractKey"
custom_field_id = "CustomFieldId"
funding_transaction_id = "TransactionId"
merchant_id = "MerchantId"
orig_transaction_id = "TransactionId"
original_transaction_id = "TransactionId"
reversal_transaction_id = "TransactionId"
transaction_id = "TransactionId"
transaction_ids = "TransactionId"

# Applied to request definitions only: responses keep the spec's looser types, so
# that an unexpected value from the API never fails a response.
[retype.requests]
# Sent as MMYY.
exp_date = "ExpDate"
# `object` in the spec, but a token is a string (and is one in responses).
card_token = "String"

[retype.fields]
# A string in the spec ("Must be zero or positive if provided"), sent as one.
"CardSaleRequest.surcharge" = "AmountString"
"CardAuthRequest.surcharge" = "AmountString"

[required]
# Required in the spec, but each is one of several alternatives ("Required if
# AchToken is not provided"). Stage 5 replaces these with source enums.
remove = [
    "AchSaleRequest.account_number",
    "AchSaleRequest.transit_number",
    "AchSaleRequest.name_on_check",
    "AchSaleRequest.ach_token",
    "AchCreditRequest.account_number",
    "AchCreditRequest.transit_number",
    "AchCreditRequest.name_on_check",
    "AchCreditRequest.ach_token",
    "AchDebitPrenoteRequest.account_number",
    "AchDebitPrenoteRequest.transit_number",
    "AchDebitPrenoteRequest.name_on_check",
    "AchDebitPrenoteRequest.ach_token",
    "AchCreditPrenoteRequest.account_number",
    "AchCreditPrenoteRequest.transit_number",
    "AchCreditPrenoteRequest.name_on_check",
    "AchCreditPrenoteRequest.ach_token",
    "AchRebillRequest.account_number",
    "AchRebillRequest.transit_number",
    "AchRebillRequest.name_on_check",
    "AchRebillRequest.ach_token",
    # "an alternative to providing the primary account number (PAN)".
    "CardAccountValidateRequest.primary_account_number",
    "CardAccountValidateRequest.card_token",
    # "Required unless TransactionId is provided" and similar.
    "AchTransactionQuery.start_date",
    "AchTransactionQuery.end_date",
    "CashTransactionQuery.start_date",
    "CashTransactionQuery.end_date",
    "LimitedCardTransactionQuery.start_date",
    "LimitedCardTransactionQuery.end_date",
    "LimitedCardTransactionQuery.transaction_id",
    # "(if numeric)": only for numeric custom fields.
    "CustomFieldRequest.decimal_places",
    "CustomFieldRequest.min_value",
    "CustomFieldRequest.max_value",
]

# Enum names, and the properties that share each one.
[enums]
AchTransactionType = [
    "AchFraudVelocityPaymentSettings.transaction_types",
    "AchFraudVelocityPaymentSettings.ach_transaction_types",
    "CardFraudVelocityPaymentSettings.ach_transaction_types",
    "DisbursementFraudVelocityPaymentSettings.ach_transaction_types",
    "GlobalFraudVelocityPaymentSettings.ach_transaction_types",
]
AchValidationDecision = ["AchAccountValidationResponse.decision"]
AchValidationProvider = ["AchAccountValidationResponse.provider"]
AchValidationExternalStatus = ["AchAccountValidationResponse.external_status"]
AchValidationInternalStatus = ["AchAccountValidationResponse.internal_status"]
CardTransactionType = [
    "AchFraudVelocityPaymentSettings.card_transaction_types",
    "CardFraudVelocityPaymentSettings.transaction_types",
    "CardFraudVelocityPaymentSettings.card_transaction_types",
    "DisbursementFraudVelocityPaymentSettings.card_transaction_types",
    "GlobalFraudVelocityPaymentSettings.card_transaction_types",
]
ContractStatus = ["ContractRequest.status"]
CountryCode = ["Address.country_code"]
Currency = ["CardDisbursementReportRequest.currency"]
CustomerStatus = ["CustomerBaseRequest.status"]
# Codes "0" to "2", with the text alongside in a `_text` property.
NameMatch = [
    "AchAccountValidationResponse.name_validation_result",
    "AchNameValidationResultDetails.first_name_validation_result",
    "AchNameValidationResultDetails.last_name_validation_result",
    "CardAccountValidateResponse.name_validation_result",
    "CardNameValidationResultDetails.first_name_validation_result",
    "CardNameValidationResultDetails.middle_name_validation_result",
    "CardNameValidationResultDetails.last_name_validation_result",
]
NameMatchText = [
    "AchAccountValidationResponse.name_validation_result_text",
    "AchNameValidationResultDetails.first_name_validation_result_text",
    "AchNameValidationResultDetails.last_name_validation_result_text",
    "CardAccountValidateResponse.name_validation_result_text",
    "CardNameValidationResultDetails.first_name_validation_result_text",
    "CardNameValidationResultDetails.middle_name_validation_result_text",
    "CardNameValidationResultDetails.last_name_validation_result_text",
]
# Codes "0" and "1".
OfacMatch = [
    "AchAccountValidationResponse.ofac_validation_result",
    "OfacValidationResultDetails.name_validation_result",
    "OfacValidationResultDetails.address_validation_result",
    "OfacValidationResultDetails.date_of_birth_validation_result",
]
OfacMatchText = [
    "OfacValidationResultDetails.name_validation_result_text",
    "OfacValidationResultDetails.address_validation_result_text",
    "OfacValidationResultDetails.date_of_birth_validation_result_text",
]
OfacScreeningText = ["AchAccountValidationResponse.ofac_validation_result_text"]
ReportType = ["CardTransactions_QuerySalesByDate.report_type"]
State = ["Address.state"]
# A .NET `HttpStatusCode` name, such as "BadRequest".
StatusCode = ["ErrorResponse.status_code"]
TimeframeMode = [
    "AchFraudVelocityPaymentSettings.timeframe_mode",
    "CardFraudVelocityPaymentSettings.timeframe_mode",
    "DisbursementFraudVelocityPaymentSettings.timeframe_mode",
    "GlobalFraudVelocityPaymentSettings.timeframe_mode",
]
TrackingModel = [
    "AchFraudVelocityPaymentSettings.tracking_models",
    "CardFraudVelocityPaymentSettings.tracking_models",
    "DisbursementFraudVelocityPaymentSettings.tracking_models",
    "GlobalFraudVelocityPaymentSettings.tracking_models",
]

# Variant names for values that are not Rust identifiers.
[enum_variants.NameMatch]
"0" = "Match"
"1" = "PartialMatch"
"2" = "NoMatch"

[enum_variants.OfacMatch]
"0" = "Match"
"1" = "NoMatch"

